name: ipchronicle

services:
  center:
    image: ipchronicle-center:dev
    build:
      context: ..
      args:
        VERSION: dev
    restart: unless-stopped
    environment:
      IPCHRONICLE_LISTEN_ADDRESS: :8080
    ports:
      - "${IPCHRONICLE_HTTP_PORT:-8080}:8080"
    volumes:
      - center-data:/var/lib/ipchronicle
    healthcheck:
      test: ["CMD", "/usr/local/bin/ipchronicle-center", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6

volumes:
  center-data:
