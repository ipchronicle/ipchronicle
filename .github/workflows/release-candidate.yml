name: Release candidate artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical release candidate version without the v prefix
        required: true
        default: 0.1.0-rc.3
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Build candidate
        env:
          VERSION: ${{ inputs.version }}
        run: make release-candidate VERSION="$VERSION"
      - name: Verify candidate
        env:
          VERSION: ${{ inputs.version }}
        run: make verify-release-candidate VERSION="$VERSION"
      - name: Run deterministic release failure gate
        run: make release-failure-gate
      - name: Upload temporary candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated-a
          path: dist/release/${{ inputs.version }}/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  reproducibility:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated-a
          path: dist/reference/${{ inputs.version }}
      - name: Restore reference executable modes after artifact transport
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x \
            "dist/reference/$VERSION/install-agent.sh" \
            "dist/reference/$VERSION/ipchronicle-agent-linux-amd64" \
            "dist/reference/$VERSION/ipchronicle-agent-linux-arm64"
      - name: Verify reference candidate
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/verify-release-candidate.sh "dist/reference/$VERSION"
      - name: Build independent candidate
        env:
          IPCHRONICLE_RELEASE_OUTPUT_ROOT: ${{ github.workspace }}/dist/rebuilt
          VERSION: ${{ inputs.version }}
        run: make release-candidate VERSION="$VERSION"
      - name: Verify independent candidate
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/verify-release-candidate.sh "dist/rebuilt/$VERSION"
      - name: Compare independent candidates
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/compare-release-candidates.sh "dist/reference/$VERSION" "dist/rebuilt/$VERSION"
      - name: Upload independent temporary candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated-b
          path: dist/rebuilt/${{ inputs.version }}/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  distribution:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        distribution:
          - debian-12
          - debian-13
          - ubuntu-24.04
          - ubuntu-26.04
          - rhel-8
          - rhel-9
          - rhel-10
          - rocky-8
          - rocky-9
          - rocky-10
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - centos-stream-9
          - centos-stream-10
          - alpine-3.23
          - alpine-3.24
        architecture:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated-a
          path: dist/release/${{ inputs.version }}
      - name: Restore executable modes after artifact transport
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ inputs.version }}
        run: chmod +x "dist/release/$VERSION/install-agent.sh" "dist/release/$VERSION/ipchronicle-agent-linux-$ARCHITECTURE"
      - name: Test Agent distribution lifecycle
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DISTRIBUTION: ${{ matrix.distribution }}
          VERSION: ${{ inputs.version }}
        run: scripts/test-release-distribution.sh "dist/release/$VERSION" "$DISTRIBUTION" "$ARCHITECTURE"

  resources:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated-a
          path: dist/release/${{ inputs.version }}
      - name: Restore executable modes after artifact transport
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ inputs.version }}
        run: chmod +x "dist/release/$VERSION/install-agent.sh" "dist/release/$VERSION/ipchronicle-agent-linux-$ARCHITECTURE"
      - name: Test release resource limits and live IPQuality execution
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ inputs.version }}
        run: scripts/test-release-resources.sh "dist/release/$VERSION" "$ARCHITECTURE"

  finalize:
    needs: [candidate, reproducibility, distribution, resources]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated-a
          path: dist/final-a/${{ inputs.version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated-b
          path: dist/final-b/${{ inputs.version }}
      - name: Restore executable modes after artifact transport
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x \
            "dist/final-a/$VERSION/install-agent.sh" \
            "dist/final-a/$VERSION/ipchronicle-agent-linux-amd64" \
            "dist/final-a/$VERSION/ipchronicle-agent-linux-arm64"
          chmod +x \
            "dist/final-b/$VERSION/install-agent.sh" \
            "dist/final-b/$VERSION/ipchronicle-agent-linux-amd64" \
            "dist/final-b/$VERSION/ipchronicle-agent-linux-arm64"
      - name: Resolve exact validation evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          ci_runs=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f "head_sha=$REVISION" -f status=success -f per_page=100)
          ci_run_url=$(jq -er --arg revision "$REVISION" '
            [.workflow_runs[] | select(.head_sha == $revision and .conclusion == "success")] |
            sort_by(.run_number) | last | .html_url
          ' <<<"$ci_runs")
          rc_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          validation_date=$(date -u +%F)
          {
            echo "ci_run_url=$ci_run_url"
            echo "rc_run_url=$rc_run_url"
            echo "validation_date=$validation_date"
          } >>"$GITHUB_OUTPUT"
      - name: Finalize both candidate reports
        env:
          CI_RUN_URL: ${{ steps.evidence.outputs.ci_run_url }}
          RC_RUN_URL: ${{ steps.evidence.outputs.rc_run_url }}
          VALIDATION_DATE: ${{ steps.evidence.outputs.validation_date }}
          VERSION: ${{ inputs.version }}
        run: |
          scripts/finalize-release-candidate.sh \
            "dist/final-a/$VERSION" "$CI_RUN_URL" "$RC_RUN_URL" "$VALIDATION_DATE"
          scripts/finalize-release-candidate.sh \
            "dist/final-b/$VERSION" "$CI_RUN_URL" "$RC_RUN_URL" "$VALIDATION_DATE"
      - name: Verify finalized reproducibility
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/compare-release-candidates.sh "dist/final-a/$VERSION" "dist/final-b/$VERSION"
      - name: Upload final release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}
          path: dist/final-a/${{ inputs.version }}/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
