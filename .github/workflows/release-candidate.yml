name: Release candidate artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical release version without the v prefix
        required: true
        default: 0.1.1
        type: string
      full_validation:
        description: Run every release validation gate
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      distribution: ${{ steps.scope.outputs.distribution }}
      resources: ${{ steps.scope.outputs.resources }}
      compose: ${{ steps.scope.outputs.compose }}
      browser: ${{ steps.scope.outputs.browser }}
      failure: ${{ steps.scope.outputs.failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify release validation scope
        id: scope
        env:
          FORCE_FULL: ${{ inputs.full_validation }}
          VERSION: ${{ inputs.version }}
        run: scripts/classify-release-validation.sh "$VERSION" "$FORCE_FULL" | tee -a "$GITHUB_OUTPUT"

  source-check:
    if: needs.classify.outputs.full == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run extended repository checks
        run: make check

  candidate:
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Build candidate
        env:
          VERSION: ${{ inputs.version }}
        run: make release-candidate VERSION="$VERSION"
      - name: Verify candidate
        env:
          VERSION: ${{ inputs.version }}
        run: make verify-release-candidate VERSION="$VERSION"
      - name: Upload temporary candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated
          path: dist/release/${{ inputs.version }}/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  reproducibility:
    if: needs.classify.outputs.full == 'true'
    needs: [classify, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated
          path: dist/reference/${{ inputs.version }}
      - name: Restore reference executable modes after artifact transport
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x \
            "dist/reference/$VERSION/install-agent.sh" \
            "dist/reference/$VERSION/ipchronicle-agent-linux-amd64" \
            "dist/reference/$VERSION/ipchronicle-agent-linux-arm64"
      - name: Verify reference candidate
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/verify-release-candidate.sh "dist/reference/$VERSION"
      - name: Build independent candidate
        env:
          IPCHRONICLE_RELEASE_OUTPUT_ROOT: ${{ github.workspace }}/dist/rebuilt
          VERSION: ${{ inputs.version }}
        run: make release-candidate VERSION="$VERSION"
      - name: Verify independent candidate
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/verify-release-candidate.sh "dist/rebuilt/$VERSION"
      - name: Compare independent candidates
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/compare-release-candidates.sh "dist/reference/$VERSION" "dist/rebuilt/$VERSION"

  distribution:
    if: needs.classify.outputs.distribution == 'true'
    needs: [classify, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        distribution:
          - debian-12
          - debian-13
          - ubuntu-24.04
          - ubuntu-26.04
          - rhel-8
          - rhel-9
          - rhel-10
          - rocky-8
          - rocky-9
          - rocky-10
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - centos-stream-9
          - centos-stream-10
          - alpine-3.23
          - alpine-3.24
        architecture:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated
          path: dist/release/${{ inputs.version }}
      - name: Restore executable modes after artifact transport
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ inputs.version }}
        run: chmod +x "dist/release/$VERSION/install-agent.sh" "dist/release/$VERSION/ipchronicle-agent-linux-$ARCHITECTURE"
      - name: Test Agent distribution lifecycle
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DISTRIBUTION: ${{ matrix.distribution }}
          VERSION: ${{ inputs.version }}
        run: scripts/test-release-distribution.sh "dist/release/$VERSION" "$DISTRIBUTION" "$ARCHITECTURE"

  resources:
    if: needs.classify.outputs.resources == 'true'
    needs: [classify, candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated
          path: dist/release/${{ inputs.version }}
      - name: Restore executable modes after artifact transport
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ inputs.version }}
        run: chmod +x "dist/release/$VERSION/install-agent.sh" "dist/release/$VERSION/ipchronicle-agent-linux-$ARCHITECTURE"
      - name: Test release resource limits and live IPQuality execution
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ inputs.version }}
        run: scripts/test-release-resources.sh "dist/release/$VERSION" "$ARCHITECTURE"

  compose:
    if: needs.classify.outputs.compose == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Compose smoke test
        run: make compose-smoke

  browser:
    if: needs.classify.outputs.browser == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run desktop and mobile browser tests
        run: make browser-test

  failure-gate:
    if: needs.classify.outputs.failure == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run deterministic release failure gate
        run: make release-failure-gate

  finalize:
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      needs.candidate.result == 'success' &&
      (needs.source-check.result == 'success' || needs.source-check.result == 'skipped') &&
      (needs.reproducibility.result == 'success' || needs.reproducibility.result == 'skipped') &&
      (needs.distribution.result == 'success' || needs.distribution.result == 'skipped') &&
      (needs.resources.result == 'success' || needs.resources.result == 'skipped') &&
      (needs.compose.result == 'success' || needs.compose.result == 'skipped') &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped') &&
      (needs.failure-gate.result == 'success' || needs.failure-gate.result == 'skipped')
    needs:
      - classify
      - source-check
      - candidate
      - reproducibility
      - distribution
      - resources
      - compose
      - browser
      - failure-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}-unvalidated
          path: dist/final/${{ inputs.version }}
      - name: Restore executable modes after artifact transport
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x \
            "dist/final/$VERSION/install-agent.sh" \
            "dist/final/$VERSION/ipchronicle-agent-linux-amd64" \
            "dist/final/$VERSION/ipchronicle-agent-linux-arm64"
      - name: Resolve exact validation evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          ci_runs=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f "head_sha=$REVISION" -f status=success -f per_page=100)
          ci_run_url=$(jq -er --arg revision "$REVISION" '
            [.workflow_runs[] | select(.head_sha == $revision and .conclusion == "success")] |
            sort_by(.run_number) | last | .html_url
          ' <<<"$ci_runs")
          rc_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          validation_date=$(date -u +%F)
          {
            echo "ci_run_url=$ci_run_url"
            echo "rc_run_url=$rc_run_url"
            echo "validation_date=$validation_date"
          } >>"$GITHUB_OUTPUT"
      - name: Finalize candidate report
        env:
          CI_RUN_URL: ${{ steps.evidence.outputs.ci_run_url }}
          RC_RUN_URL: ${{ steps.evidence.outputs.rc_run_url }}
          VALIDATION_DATE: ${{ steps.evidence.outputs.validation_date }}
          VERSION: ${{ inputs.version }}
        run: scripts/finalize-release-candidate.sh "dist/final/$VERSION" "$CI_RUN_URL" "$RC_RUN_URL" "$VALIDATION_DATE"
      - name: Upload final release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipchronicle-v${{ inputs.version }}-${{ github.sha }}
          path: dist/final/${{ inputs.version }}/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
