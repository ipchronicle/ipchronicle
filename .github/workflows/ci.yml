name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository checks
        run: make check
      - name: Scan committed source for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
      - name: Build center image
        run: docker buildx build --platform "${{ matrix.platform }}" --load --tag ipchronicle-center:ci .
      - name: Check image metadata
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker image inspect ipchronicle-center:ci --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' | grep -Fx AGPL-3.0-only
          architecture=${PLATFORM#linux/}
          metadata=$(docker run --rm --platform "$PLATFORM" \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 64m --cpus 1 --pids-limit 64 ipchronicle-center:ci version --json)
          jq -e --arg arch "$architecture" \
            '.version == "dev" and .component == "center" and .os == "linux" and .arch == $arch' \
            <<<"$metadata" >/dev/null
          test "$(docker run --rm --platform "$PLATFORM" --entrypoint id ipchronicle-center:ci -u)" = 10001

  compose:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Compose smoke test
        run: make compose-smoke

  browser:
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run desktop and mobile browser tests
        run: make browser-test
