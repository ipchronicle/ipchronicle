name: Publish latest image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-latest-image
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name | ltrimstr("v")')
          test -n "$version"
          test "$(git rev-parse HEAD)" = "$REVISION"
          {
            echo "revision=$REVISION"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Build and publish image
        env:
          REVISION: ${{ steps.metadata.outputs.revision }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            --build-arg "SOURCE_URL=https://github.com/$GITHUB_REPOSITORY/tree/$REVISION" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipchronicle-center:latest" \
            --push \
            .

      - name: Verify published image
        env:
          REVISION: ${{ steps.metadata.outputs.revision }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipchronicle-center:latest"
          docker buildx imagetools inspect "$image" >/dev/null
          docker pull --platform linux/amd64 "$image"
          metadata=$(docker run --rm --platform linux/amd64 --network none "$image" version --json)
          jq -e --arg version "$VERSION" --arg revision "$REVISION" '
            .version == $version and .revision == $revision and
            .component == "center" and .os == "linux" and .arch == "amd64"
          ' <<<"$metadata" >/dev/null
