name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical release candidate version without the v prefix
        required: true
        default: 0.1.0-rc.2
        type: string
      candidate_run_id:
        description: Successful Release candidate artifact workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve validated candidate
        id: candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver_number='(0|[1-9][0-9]*)'
          if [[ ! $VERSION =~ ^${semver_number}\.${semver_number}\.${semver_number}-rc\.${semver_number}$ ]]; then
            echo "version is not a supported canonical release candidate version" >&2
            exit 1
          fi
          if [[ ! $CANDIDATE_RUN_ID =~ ^[1-9][0-9]*$ ]]; then
            echo "candidate run ID is invalid" >&2
            exit 1
          fi

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .event == "workflow_dispatch" and
            .path == ".github/workflows/release-candidate.yml" and
            .head_repository.full_name == $repository
          ' <<<"$run_json" >/dev/null
          revision=$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<<"$run_json")
          artifact_name="ipchronicle-v${VERSION}-${revision}"
          artifacts_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts")
          jq -e --arg name "$artifact_name" '
            [.artifacts[] | select(.name == $name and .expired == false)] | length == 1
          ' <<<"$artifacts_json" >/dev/null

          {
            echo "artifact_name=$artifact_name"
            echo "revision=$revision"
            echo "tag=v$VERSION"
          } >>"$GITHUB_OUTPUT"

      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.candidate.outputs.revision }}

      - name: Verify immutable tag
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_revision=$(git rev-parse "$TAG^{commit}")
          test "$tag_revision" = "$REVISION"

      - name: Download final candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: dist/publish/${{ inputs.version }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify final candidate artifact
        env:
          RELEASE_DIRECTORY: dist/publish/${{ inputs.version }}
        run: |
          set -euo pipefail
          chmod 0755 \
            "$RELEASE_DIRECTORY/install-agent.sh" \
            "$RELEASE_DIRECTORY/ipchronicle-agent-linux-amd64" \
            "$RELEASE_DIRECTORY/ipchronicle-agent-linux-arm64"
          (cd "$RELEASE_DIRECTORY" && sha256sum --check checksums.txt)
          scripts/verify-release-candidate.sh "$RELEASE_DIRECTORY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Publish candidate images
        id: image
        env:
          RELEASE_DIRECTORY: ${{ github.workspace }}/dist/publish/${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/release-images.env
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipchronicle-center:v$VERSION"
          for architecture in amd64 arm64; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$HOME/.docker:/auth:ro" -v "$RELEASE_DIRECTORY:/release:ro" \
              "$SKOPEO_IMAGE" copy --authfile /auth/config.json --preserve-digests \
              --override-os linux --override-arch "$architecture" \
              "oci-archive:/release/ipchronicle-center-linux-$architecture.oci.tar" \
              "docker://$image-$architecture"
          done
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          echo "reference=$image" >>"$GITHUB_OUTPUT"

      - name: Make the Center package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/ipchronicle-center/visibility" \
            -f visibility=public >/dev/null

      - name: Verify the public multi-architecture image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/release-images.env
          inspect_raw() {
            docker run --rm "$SKOPEO_IMAGE" inspect --raw "docker://$1"
          }
          inspect_digest() {
            docker run --rm "$SKOPEO_IMAGE" inspect --format '{{.Digest}}' "docker://$1"
          }
          amd64_digest=$(inspect_digest "$IMAGE-amd64")
          arm64_digest=$(inspect_digest "$IMAGE-arm64")
          index=$(inspect_raw "$IMAGE")
          jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
            .schemaVersion == 2 and
            ([.manifests[] | {arch: .platform.architecture, os: .platform.os, digest}] | sort_by(.arch)) == [
              {arch: "amd64", os: "linux", digest: $amd64},
              {arch: "arm64", os: "linux", digest: $arm64}
            ]
          ' <<<"$index" >/dev/null
          docker pull --platform linux/amd64 "$IMAGE"
          metadata=$(docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
            --memory 64m --cpus 1 --pids-limit 64 "$IMAGE" version --json)
          jq -e --arg version "$VERSION" --arg revision "$REVISION" '
            .version == $version and .revision == $revision and
            .component == "center" and .os == "linux" and .arch == "amd64"
          ' <<<"$metadata" >/dev/null

      - name: Create or update draft prerelease
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: dist/publish/${{ inputs.version }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          TAG: ${{ steps.candidate.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat >"$notes_file" <<EOF
          IPChronicle $VERSION is a release candidate for personal self-hosted installations.

          - Source revision: \`$REVISION\`
          - Candidate validation: https://github.com/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID
          - Center image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipchronicle-center:$TAG\`
          - Supported image platforms: \`linux/amd64\`, \`linux/arm64\`

          Read \`OPERATOR_GUIDE.md\` before installation or upgrade. Verify downloaded assets with
          \`checksums.txt\` and \`release-manifest.json\`.
          EOF

          if gh release view "$TAG" --json isDraft,isPrerelease >"$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e '.isDraft == true and .isPrerelease == true' "$RUNNER_TEMP/release.json" >/dev/null
          else
            gh release create "$TAG" --verify-tag --draft --prerelease --latest=false \
              --title "IPChronicle $TAG" --notes-file "$notes_file"
          fi
          gh release edit "$TAG" --draft --prerelease --latest=false \
            --title "IPChronicle $TAG" --notes-file "$notes_file"
          gh release upload "$TAG" --clobber "$RELEASE_DIRECTORY"/*

      - name: Verify and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: dist/publish/${{ inputs.version }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-assets.tsv"
          actual="$RUNNER_TEMP/actual-assets.tsv"
          for path in "$RELEASE_DIRECTORY"/*; do
            name=$(basename "$path")
            size=$(stat --format=%s "$path")
            digest="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            printf '%s\t%s\t%s\n' "$name" "$size" "$digest"
          done | LC_ALL=C sort >"$expected"
          gh release view "$TAG" --json assets --jq \
            '.assets[] | [.name, (.size | tostring), .digest] | @tsv' |
            LC_ALL=C sort >"$actual"
          diff --unified "$expected" "$actual"
          gh release edit "$TAG" --draft=false --prerelease --latest=false >/dev/null
          release_json=$(gh release view "$TAG" --json isDraft,isPrerelease,tagName,url)
          jq -e --arg tag "$TAG" '
            .isDraft == false and .isPrerelease == true and .tagName == $tag
          ' <<<"$release_json" >/dev/null
          jq -r '.url' <<<"$release_json"
