          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProbeArtifactReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "403":
          $ref: "#/components/responses/AgentForbidden"
components:
  securitySchemes:
    administratorSession:
      type: apiKey
      in: cookie
      name: ipchronicle_session
    agentCredential:
      type: http
      scheme: bearer
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 20
        maxLength: 128
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EgressId:
      name: egressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProxyId:
      name: proxyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SenderId:
      name: senderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationSenderFilter:
      name: senderId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    NotificationDeliveryStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/NotificationDeliveryStatus"
    HistoryNodeFilter:
      name: nodeId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    HistoryEgressFilter:
      name: egressId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    HistoryFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    HistoryTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    HistoryProbeRunStatus:
      name: runStatus
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProbeRunStatus"
    HistoryProbeTrigger:
      name: trigger
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProbeTrigger"
    HistoryProbeChanged:
      name: changed
      in: query
      required: false
      schema:
        type: boolean
    HistoryProbeFormatStatus:
      name: formatStatus
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ProbeFormatStatus"
    HistoryAddressEventKind:
      name: eventKind
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AddressEventKind"
    HistoryAddressFamily:
      name: family
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AddressFamily"
    HistoryPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
    HistoryPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 50
    HistoryGapPage:
      name: gapPage
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request failed an origin or CSRF check.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The requested state transition conflicts with current state.
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    AgentUnauthorized:
      description: The Agent credential or registration key is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgentForbidden:
      description: Agent registration or authority is disabled or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SupportedLocale:
      type: string
      enum: [zh-CN, en]
    Account:
      type: object
      additionalProperties: false
      required: [username, locale, usesDefaultCredentials, totpEnabled]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          $ref: "#/components/schemas/SupportedLocale"
        usesDefaultCredentials:
          type: boolean
        totpEnabled:
          type: boolean
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [account, csrfToken, expiresAt]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        csrfToken:
          type: string
          minLength: 20
        expiresAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
        totpCode:
          type: string
          pattern: "^[0-9]{6}$"
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        username:
          type: string
          minLength: 1
          maxLength: 64
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    AccountUpdateResult:
      type: object
      additionalProperties: false
      required: [account, sessionRevoked]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        sessionRevoked:
          type: boolean
    LocaleUpdateRequest:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale:
          $ref: "#/components/schemas/SupportedLocale"
    CurrentPasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
    TOTPCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
    DisableTOTPRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, code]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          pattern: "^[0-9]{6}$"
    TOTPEnrollment:
      type: object
      additionalProperties: false
      required: [secret, provisioningUri]
      properties:
        secret:
          type: string
          minLength: 16
        provisioningUri:
          type: string
          format: uri
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_credentials
        - totp_required
        - rate_limited
        - unauthenticated
        - csrf_failed
        - origin_not_allowed
        - current_password_invalid
        - invalid_totp
        - totp_already_enabled
        - totp_not_enabled
        - totp_enrollment_not_started
        - no_account_change
        - registration_key_not_initialized
        - registration_key_invalid
        - registration_disabled
        - agent_unauthenticated
        - agent_revoked
        - node_not_found
        - node_revoked
        - node_disabled
        - node_deletion_pending
        - node_sync_unsupported
        - sync_session_unavailable
        - network_inventory_unavailable
        - invalid_egress_candidate
        - egress_already_exists
        - egress_limit_reached
        - egress_not_found
        - egress_deletion_pending
        - invalid_network_proxy
        - network_proxy_not_found
        - network_proxy_already_exists
        - network_proxy_limit_reached
        - network_proxy_in_use
        - invalid_observation_settings
        - invalid_probe_settings
        - node_offline
        - probe_task_slot_occupied
        - probe_already_running
        - probe_paused_low_memory
        - no_enabled_egress
