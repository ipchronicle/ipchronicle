openapi: 3.1.0
info:
  title: IPChronicle API
  version: 0.0.0
  description: Contract for the IPChronicle center and managed-node Agent.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Start an administrator session
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The administrator is authenticated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Login attempts are temporarily throttled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/session:
    get:
      operationId: getAuthenticatedSession
      summary: Read the current administrator session
      tags: [authentication]
      responses:
        "200":
          description: The current session and account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current administrator session
      tags: [authentication]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The session was revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account:
    get:
      operationId: getAccount
      summary: Read the administrator account
      tags: [account]
      responses:
        "200":
          description: The administrator account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateAccount
      summary: Change the administrator username or password
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: The account was updated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account/locale:
    put:
      operationId: updateAccountLocale
      summary: Persist the administrator language preference
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocaleUpdateRequest"
      responses:
        "200":
          description: The account language was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account/totp/enrollment:
    post:
      operationId: startTOTPEnrollment
      summary: Start TOTP enrollment
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentPasswordRequest"
      responses:
        "200":
          description: One-time TOTP enrollment material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/account/totp:
    post:
      operationId: confirmTOTPEnrollment
      summary: Confirm and enable TOTP
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: TOTP was enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: disableTOTP
      summary: Disable TOTP and revoke all sessions
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTOTPRequest"
      responses:
        "204":
          description: TOTP was disabled and all sessions were revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/account/sessions:
    delete:
      operationId: revokeAllSessions
      summary: Revoke every administrator session
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Every administrator session was revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Read center status
      tags: [system]
      responses:
        "200":
          description: The center is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/nodes:
    get:
      operationId: listNodes
      summary: List registered nodes
      tags: [nodes]
      responses:
        "200":
          description: Registered nodes ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/nodes/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    patch:
      operationId: updateNode
      summary: Update node monitoring state
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          description: The node was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteNode
      summary: Permanently delete a node and all owned data
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Durable node deletion has been queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDeletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/nodes/{nodeId}/revoke:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: revokeNode
      summary: Permanently revoke a node Agent credential
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The Agent credential was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/nodes/{nodeId}/sync-session:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: startNodeSyncSession
      summary: Start or replace a ten-minute temporary node sync session
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The temporary sync session was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: stopNodeSyncSession
      summary: Stop the current temporary node sync session
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The temporary sync session is stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/nodes/{nodeId}/probe:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getNodeProbe
      summary: Read complete-probe settings, current task, and recent runs
      tags: [probes]
      responses:
        "200":
          description: Current complete-probe state for the node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeProbeState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateNodeProbeSettings
      summary: Replace the node complete-probe schedule and resource override
      tags: [probes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeProbeSettingsUpdate"
      responses:
        "200":
          description: Complete-probe settings were updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeProbeState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/nodes/{nodeId}/probe/tasks:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: createCompleteProbeTask
      summary: Create the node's single immediate complete-probe task
      tags: [probes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: The immediate task was created for an online Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/agent-updates:
    get:
      operationId: getAgentUpdateState
      summary: Discover the current channel release and recent Agent update tasks
      tags: [agent-updates]
      responses:
        "200":
          description: Current release channel, discovery result, and update tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUpdateState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAgentUpdateTasks
      summary: Create Agent update tasks for one or more online nodes
      tags: [agent-updates]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdateBatchRequest"
      responses:
        "202":
          description: Per-node task creation outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUpdateBatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/agent-updates/channel:
    put:
      operationId: updateReleaseChannel
      summary: Select the stable or release-candidate discovery channel
      tags: [agent-updates]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseChannelUpdate"
      responses:
        "200":
          description: Updated release discovery state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUpdateState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/probe-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getProbeRun
      summary: Read one complete-probe run and its frozen egress executions
      tags: [probes]
      responses:
        "200":
          description: Complete-probe run detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/probe-snapshots/{snapshotId}:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      operationId: getProbeSnapshot
      summary: Read one retained complete-probe source snapshot
      tags: [probes]
      responses:
        "200":
          description: The exact JSON bytes captured by the Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/probe-snapshots/{snapshotId}/star:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    put:
      operationId: starProbeSnapshot
      summary: Protect a probe snapshot from automatic retention cleanup
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The snapshot is starred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unstarProbeSnapshot
      summary: Remove automatic retention protection from a probe snapshot
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The snapshot is no longer starred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/history:
    get:
      operationId: getHistoryState
      summary: Read the current history generation and reset state
      tags: [history]
      responses:
        "200":
          description: Current history state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: resetHistory
      summary: Delete all observed history and advance its generation
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: History was cleared and its generation advanced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/history/probe-snapshots:
    get:
      operationId: listHistoryProbeSnapshots
      summary: List retained complete-probe snapshots across nodes
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/HistoryNodeFilter"
        - $ref: "#/components/parameters/HistoryEgressFilter"
        - $ref: "#/components/parameters/HistoryFrom"
        - $ref: "#/components/parameters/HistoryTo"
        - $ref: "#/components/parameters/HistoryProbeRunStatus"
        - $ref: "#/components/parameters/HistoryProbeTrigger"
        - $ref: "#/components/parameters/HistoryProbeChanged"
        - $ref: "#/components/parameters/HistoryProbeFormatStatus"
        - $ref: "#/components/parameters/HistoryPage"
        - $ref: "#/components/parameters/HistoryPageSize"
      responses:
        "200":
          description: A filtered page of retained probe snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeSnapshotHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/history/address-events:
    get:
      operationId: listHistoryAddressEvents
      summary: List retained confirmed address events and reported gaps
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/HistoryNodeFilter"
        - $ref: "#/components/parameters/HistoryEgressFilter"
        - $ref: "#/components/parameters/HistoryFrom"
        - $ref: "#/components/parameters/HistoryTo"
        - $ref: "#/components/parameters/HistoryAddressEventKind"
        - $ref: "#/components/parameters/HistoryAddressFamily"
        - $ref: "#/components/parameters/HistoryPage"
        - $ref: "#/components/parameters/HistoryGapPage"
        - $ref: "#/components/parameters/HistoryPageSize"
      responses:
        "200":
          description: A filtered page of address events and explicit gaps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/history/probe-gaps:
    get:
      operationId: listHistoryProbeGaps
      summary: List explicit complete-probe history gaps
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/HistoryNodeFilter"
        - $ref: "#/components/parameters/HistoryEgressFilter"
        - $ref: "#/components/parameters/HistoryFrom"
        - $ref: "#/components/parameters/HistoryTo"
        - $ref: "#/components/parameters/HistoryPage"
        - $ref: "#/components/parameters/HistoryPageSize"
      responses:
        "200":
          description: Explicit complete-probe gaps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeHistoryGapPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/history/format-events:
    get:
      operationId: listHistoryFormatEvents
      summary: List upstream complete-report format events
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/HistoryNodeFilter"
        - $ref: "#/components/parameters/HistoryEgressFilter"
        - $ref: "#/components/parameters/HistoryFrom"
        - $ref: "#/components/parameters/HistoryTo"
        - $ref: "#/components/parameters/HistoryPage"
        - $ref: "#/components/parameters/HistoryPageSize"
      responses:
        "200":
          description: Upstream format mismatch, change, and recovery events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeFormatEventPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/history/comparison:
    get:
      operationId: compareProbeSnapshots
      summary: Compare two retained snapshots from the same network egress
      tags: [history]
      parameters:
        - name: beforeSnapshotId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: afterSnapshotId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A direct typed comparison of every known field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeSnapshotComparison"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/history/retention:
    put:
      operationId: updateHistoryRetention
      summary: Replace the global history retention policy and apply it
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryRetentionUpdate"
      responses:
        "200":
          description: The retention policy was saved and cleanup completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/history/cleanup:
    post:
      operationId: cleanupHistory
      summary: Apply the saved history retention policy now
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Retention cleanup completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryCleanupResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notification-senders:
    get:
      operationId: listNotificationSenders
      summary: List configured notification senders
      tags: [notifications]
      responses:
        "200":
          description: Current Telegram, Webhook, and JavaScript senders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSenderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNotificationSender
      summary: Create a notification sender
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSenderCreate"
      responses:
        "201":
          description: The sender was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSender"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/notification-senders/{senderId}:
    parameters:
      - $ref: "#/components/parameters/SenderId"
    put:
      operationId: updateNotificationSender
      summary: Replace a notification sender while optionally retaining hidden credentials
