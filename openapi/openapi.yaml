openapi: 3.1.0
info:
  title: IPChronicle API
  version: 0.0.0
  description: Contract for the IPChronicle center and managed-node Agent.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Start an administrator session
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The administrator is authenticated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Login attempts are temporarily throttled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/session:
    get:
      operationId: getAuthenticatedSession
      summary: Read the current administrator session
      tags: [authentication]
      responses:
        "200":
          description: The current session and account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current administrator session
      tags: [authentication]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The session was revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account:
    get:
      operationId: getAccount
      summary: Read the administrator account
      tags: [account]
      responses:
        "200":
          description: The administrator account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateAccount
      summary: Change the administrator username or password
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: The account was updated.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account/locale:
    put:
      operationId: updateAccountLocale
      summary: Persist the administrator language preference
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocaleUpdateRequest"
      responses:
        "200":
          description: The account language was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/account/totp/enrollment:
    post:
      operationId: startTOTPEnrollment
      summary: Start TOTP enrollment
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrentPasswordRequest"
      responses:
        "200":
          description: One-time TOTP enrollment material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/account/totp:
    post:
      operationId: confirmTOTPEnrollment
      summary: Confirm and enable TOTP
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: TOTP was enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: disableTOTP
      summary: Disable TOTP and revoke all sessions
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTOTPRequest"
      responses:
        "204":
          description: TOTP was disabled and all sessions were revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/account/sessions:
    delete:
      operationId: revokeAllSessions
      summary: Revoke every administrator session
      tags: [account]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Every administrator session was revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Read center status
      tags: [system]
      responses:
        "200":
          description: The center is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/nodes:
    get:
      operationId: listNodes
      summary: List registered nodes
      tags: [nodes]
      responses:
        "200":
          description: Registered nodes ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/nodes/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    patch:
      operationId: updateNode
      summary: Update node monitoring state
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          description: The node was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteNode
      summary: Permanently delete a node and all owned data
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Durable node deletion has been queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDeletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/nodes/{nodeId}/revoke:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: revokeNode
      summary: Permanently revoke a node Agent credential
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The Agent credential was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/nodes/{nodeId}/sync-session:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: startNodeSyncSession
      summary: Start or replace a ten-minute temporary node sync session
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The temporary sync session was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: stopNodeSyncSession
      summary: Stop the current temporary node sync session
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The temporary sync session is stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/nodes/{nodeId}/probe:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getNodeProbe
      summary: Read complete-probe settings, current task, and recent runs
      tags: [probes]
      responses:
        "200":
          description: Current complete-probe state for the node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeProbeState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateNodeProbeSettings
      summary: Replace the node complete-probe schedule and resource override
      tags: [probes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeProbeSettingsUpdate"
      responses:
        "200":
          description: Complete-probe settings were updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeProbeState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/nodes/{nodeId}/probe/tasks:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: createCompleteProbeTask
      summary: Create the node's single immediate complete-probe task
      tags: [probes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: The immediate task was created for an online Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/probe-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getProbeRun
      summary: Read one complete-probe run and its frozen egress executions
      tags: [probes]
      responses:
        "200":
          description: Complete-probe run detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/probe-snapshots/{snapshotId}:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      operationId: getProbeSnapshot
      summary: Read one retained complete-probe source snapshot
      tags: [probes]
      responses:
        "200":
          description: The exact JSON bytes captured by the Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/history:
    get:
      operationId: getHistoryState
      summary: Read the current history generation and reset state
      tags: [history]
      responses:
        "200":
          description: Current history state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: resetHistory
      summary: Delete all observed history and advance its generation
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: History was cleared and its generation advanced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/nodes/{nodeId}/network:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      operationId: getNodeNetwork
      summary: Read the latest network inventory, candidates, and configured egresses
      tags: [network]
      responses:
        "200":
          description: Current network state for the node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeNetworkState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/nodes/{nodeId}/egresses:
    parameters:
      - $ref: "#/components/parameters/NodeId"
    post:
      operationId: createNodeEgress
      summary: Enable a discovered interface or source-address egress
      tags: [network]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkEgressCreate"
      responses:
        "201":
          description: The durable egress was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkEgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/nodes/{nodeId}/egresses/{egressId}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/EgressId"
    patch:
      operationId: updateNodeEgress
      summary: Update a durable network egress
      tags: [network]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkEgressUpdate"
      responses:
        "200":
          description: The egress was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkEgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteNodeEgress
      summary: Permanently delete a durable network egress
      tags: [network]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Durable egress deletion has been queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EgressDeletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/network-observation-settings:
    get:
      operationId: getNetworkObservationSettings
      summary: Read global lightweight address discovery services
      tags: [network]
      responses:
        "200":
          description: Current lightweight address discovery settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkObservationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateNetworkObservationSettings
      summary: Replace global lightweight address discovery services
      tags: [network]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkObservationSettingsUpdate"
      responses:
        "200":
          description: Lightweight address discovery settings were updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkObservationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/network-proxies:
    get:
      operationId: listNetworkProxies
      summary: List centrally managed network proxies without revealing passwords
      tags: [network]
      responses:
        "200":
          description: Network proxies ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkProxyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNetworkProxy
      summary: Create a centrally managed network proxy
      tags: [network]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkProxyCreate"
      responses:
        "201":
          description: The network proxy was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkProxy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/network-proxies/{proxyId}:
    parameters:
      - $ref: "#/components/parameters/ProxyId"
    put:
      operationId: updateNetworkProxy
      summary: Replace network proxy settings and explicitly keep, replace, or clear its password
      tags: [network]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkProxyUpdate"
      responses:
        "200":
          description: The network proxy was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkProxy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteNetworkProxy
      summary: Delete an unreferenced network proxy
      tags: [network]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The network proxy was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/agent-enrollment:
    get:
      operationId: getAgentEnrollment
      summary: Read automatic Agent enrollment settings
      tags: [nodes]
      responses:
        "200":
          description: Current automatic enrollment settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnrollmentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateAgentEnrollment
      summary: Enable or disable automatic Agent enrollment
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentEnrollmentUpdate"
      responses:
        "200":
          description: Updated automatic enrollment settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnrollmentSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/agent-enrollment/key:
    post:
      operationId: rotateAgentEnrollmentKey
      summary: Generate or rotate the automatic Agent enrollment key
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Automatic enrollment is enabled with a new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnrollmentSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/agent/enroll:
    post:
      operationId: registerAgent
      summary: Register a new Agent and node
      security: []
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegistrationRequest"
      responses:
        "201":
          description: The Agent was registered with a node-specific credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegistrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "403":
          $ref: "#/components/responses/AgentForbidden"
  /api/v1/agent/control:
    post:
      operationId: pollAgent
      summary: Report Agent state and read current control state
      security:
        - agentCredential: []
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPollRequest"
      responses:
        "200":
          description: Current control-plane state for this Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPollResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "403":
          $ref: "#/components/responses/AgentForbidden"
  /api/v1/agent/configuration:
    get:
      operationId: getAgentConfiguration
      summary: Read the current complete desired Agent configuration
      security:
        - agentCredential: []
      tags: [agent]
      responses:
        "200":
          description: Current complete desired configuration snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigurationSnapshot"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "403":
          $ref: "#/components/responses/AgentForbidden"
  /api/v1/agent/probe-artifacts:
    post:
      operationId: uploadProbeArtifact
      summary: Idempotently upload one complete-probe run or execution revision
      security:
        - agentCredential: []
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProbeArtifact"
      responses:
        "200":
          description: The artifact was accepted or permanently discarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProbeArtifactReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AgentUnauthorized"
        "403":
          $ref: "#/components/responses/AgentForbidden"
components:
  securitySchemes:
    administratorSession:
      type: apiKey
      in: cookie
      name: ipchronicle_session
    agentCredential:
      type: http
      scheme: bearer
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 20
        maxLength: 128
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EgressId:
      name: egressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProxyId:
      name: proxyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request failed an origin or CSRF check.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The requested state transition conflicts with current state.
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    AgentUnauthorized:
      description: The Agent credential or registration key is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgentForbidden:
      description: Agent registration or authority is disabled or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SupportedLocale:
      type: string
      enum: [zh-CN, en]
    Account:
      type: object
      additionalProperties: false
      required: [username, locale, usesDefaultCredentials, totpEnabled]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          $ref: "#/components/schemas/SupportedLocale"
        usesDefaultCredentials:
          type: boolean
        totpEnabled:
          type: boolean
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [account, csrfToken, expiresAt]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        csrfToken:
          type: string
          minLength: 20
        expiresAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
        totpCode:
          type: string
          pattern: "^[0-9]{6}$"
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        username:
          type: string
          minLength: 1
          maxLength: 64
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    AccountUpdateResult:
      type: object
      additionalProperties: false
      required: [account, sessionRevoked]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        sessionRevoked:
          type: boolean
    LocaleUpdateRequest:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale:
          $ref: "#/components/schemas/SupportedLocale"
    CurrentPasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
    TOTPCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
    DisableTOTPRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, code]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          pattern: "^[0-9]{6}$"
    TOTPEnrollment:
      type: object
      additionalProperties: false
      required: [secret, provisioningUri]
      properties:
        secret:
          type: string
          minLength: 16
        provisioningUri:
          type: string
          format: uri
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_credentials
        - totp_required
        - rate_limited
        - unauthenticated
        - csrf_failed
        - origin_not_allowed
        - current_password_invalid
        - invalid_totp
        - totp_already_enabled
        - totp_not_enabled
        - totp_enrollment_not_started
        - no_account_change
        - registration_key_not_initialized
        - registration_key_invalid
        - registration_disabled
        - agent_unauthenticated
        - agent_revoked
        - node_not_found
        - node_revoked
        - node_disabled
        - node_deletion_pending
        - node_sync_unsupported
        - sync_session_unavailable
        - network_inventory_unavailable
        - invalid_egress_candidate
        - egress_already_exists
        - egress_limit_reached
        - egress_not_found
        - egress_deletion_pending
        - invalid_network_proxy
        - network_proxy_not_found
        - network_proxy_already_exists
        - network_proxy_limit_reached
        - network_proxy_in_use
        - invalid_observation_settings
        - invalid_probe_settings
        - node_offline
        - probe_task_slot_occupied
        - probe_already_running
        - probe_paused_low_memory
        - no_enabled_egress
        - probe_run_not_found
        - probe_snapshot_not_found
        - internal_error
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        parameters:
          type: object
          additionalProperties:
            type: string
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - version
        - configSchemaVersion
        - historySchemaVersion
        - transportSecurity
        - transportWarning
        - externalOriginConfigured
        - trustedProxyConfigured
      properties:
        service:
          type: string
          enum: [ipchronicle-center]
        status:
          type: string
          enum: [ok]
        version:
          type: string
          minLength: 1
        configSchemaVersion:
          type: integer
          format: int64
          minimum: 1
        historySchemaVersion:
          type: integer
          format: int64
          minimum: 1
        transportSecurity:
          type: string
          enum: [http, https]
        transportWarning:
          type: boolean
        externalOriginConfigured:
          type: boolean
        trustedProxyConfigured:
          type: boolean
    AgentEnrollmentSettings:
      type: object
      additionalProperties: false
      required: [enabled, hasKey]
      properties:
        enabled:
          type: boolean
        hasKey:
          type: boolean
        installationCommand:
          type: string
          minLength: 1
        rotatedAt:
          type: string
          format: date-time
    AgentEnrollmentUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    AgentPlatform:
      type: string
      enum: [linux]
    AgentArchitecture:
      type: string
      enum: [amd64, arm64]
    AgentMetadata:
      type: object
      additionalProperties: false
      required: [hostname, agentVersion, operatingSystem, architecture, capabilities, physicalMemoryBytes]
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        agentVersion:
          type: string
          minLength: 1
          maxLength: 64
        operatingSystem:
          $ref: "#/components/schemas/AgentPlatform"
        architecture:
          $ref: "#/components/schemas/AgentArchitecture"
        capabilities:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        physicalMemoryBytes:
          type: integer
          format: int64
          minimum: 1
    AgentRegistrationRequest:
      type: object
      additionalProperties: false
      required: [registrationKey, metadata]
      properties:
        registrationKey:
          type: string
          minLength: 32
          maxLength: 128
        metadata:
          $ref: "#/components/schemas/AgentMetadata"
    AgentRegistrationResult:
      type: object
      additionalProperties: false
      required: [nodeId, credential, pollIntervalSeconds]
      properties:
        nodeId:
          type: string
          format: uuid
        credential:
          type: string
          minLength: 32
          maxLength: 128
        pollIntervalSeconds:
          type: integer
          minimum: 1
          maximum: 3600
    AgentPollRequest:
      type: object
      additionalProperties: false
      required: [appliedConfigurationRevision, metadata]
      properties:
        metadata:
          $ref: "#/components/schemas/AgentMetadata"
        appliedConfigurationRevision:
          type: integer
          format: int64
          minimum: 0
        configurationError:
          type: string
          minLength: 1
          maxLength: 1024
        configurationErrorRevision:
          type: integer
          format: int64
          minimum: 1
        networkInventory:
          $ref: "#/components/schemas/NetworkInventory"
        networkInventoryError:
          type: string
          minLength: 1
          maxLength: 1024
        addressStates:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/AgentAddressState"
        addressEvents:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/AgentAddressEvent"
        addressGaps:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/AgentAddressGap"
        probeStatus:
          $ref: "#/components/schemas/AgentProbeStatus"
        taskReport:
          $ref: "#/components/schemas/AgentTaskReport"
    AgentPollResult:
      type: object
      additionalProperties: false
      required:
        - centerVersion
        - desiredConfigurationRevision
        - enabled
        - pollIntervalSeconds
        - addressUploadReceipt
      properties:
        centerVersion:
          type: string
          minLength: 1
        desiredConfigurationRevision:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: boolean
        pollIntervalSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        syncSession:
          $ref: "#/components/schemas/AgentSyncSession"
        addressUploadReceipt:
          $ref: "#/components/schemas/AgentAddressUploadReceipt"
        task:
          $ref: "#/components/schemas/AgentTask"
        acceptedTerminalTaskId:
          type: string
          format: uuid
    AgentSyncSession:
      type: object
      additionalProperties: false
      required: [id, expiresAt, websocketPath]
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        websocketPath:
          type: string
          pattern: "^/api/v1/agent/sync/[0-9a-f-]{36}$"
    AgentConfigurationSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, enabled, historyGeneration, discoveryServices, probeSchedule, probeLowMemoryOverride, egresses, proxies]
      properties:
        schemaVersion:
          type: integer
          enum: [5]
        revision:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        historyGeneration:
          type: string
          pattern: "^[0-9a-f]{64}$"
        discoveryServices:
          $ref: "#/components/schemas/NetworkObservationSettingsUpdate"
        probeSchedule:
          $ref: "#/components/schemas/ProbeSchedule"
        probeLowMemoryOverride:
          type: boolean
        egresses:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/AgentEgressConfiguration"
        proxies:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/AgentProxyConfiguration"
    AddressFamily:
      type: string
      enum: [ipv4, ipv6]
    NetworkInterface:
      type: object
      additionalProperties: false
      required: [name, index, up, loopback]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        index:
          type: integer
          minimum: 1
        up:
          type: boolean
        loopback:
          type: boolean
    NetworkAddressScope:
      type: string
      enum: [global, private, shared, unique-local, link-local, loopback, multicast, unspecified, other]
    NetworkAddress:
      type: object
      additionalProperties: false
      required: [interfaceName, address, prefixLength, family, scope, temporary, tentative, deprecated, duplicate]
      properties:
        interfaceName:
          type: string
          minLength: 1
          maxLength: 64
        address:
          type: string
          minLength: 2
          maxLength: 45
        prefixLength:
          type: integer
          minimum: 0
          maximum: 128
        family:
          $ref: "#/components/schemas/AddressFamily"
        scope:
          $ref: "#/components/schemas/NetworkAddressScope"
        temporary:
          type: boolean
        tentative:
          type: boolean
        deprecated:
          type: boolean
        duplicate:
          type: boolean
    NetworkRoute:
      type: object
      additionalProperties: false
      required: [interfaceName, family, destination, metric, default]
      properties:
        interfaceName:
          type: string
          minLength: 1
          maxLength: 64
        family:
          $ref: "#/components/schemas/AddressFamily"
        destination:
          type: string
          minLength: 3
          maxLength: 49
        gateway:
          type: string
          minLength: 2
          maxLength: 45
        metric:
          type: integer
          format: int64
          minimum: 0
        default:
          type: boolean
    NetworkInventory:
      type: object
      additionalProperties: false
      required: [capturedAt, interfaces, addresses, routes]
      properties:
        capturedAt:
          type: string
          format: date-time
        interfaces:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/NetworkInterface"
        addresses:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/NetworkAddress"
        routes:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/NetworkRoute"
    NetworkEgressKind:
      type: string
      enum: [default, interface, source, proxy]
    NetworkEgress:
      type: object
      additionalProperties: false
      required: [id, nodeId, name, kind, family, enabled, available, automatic, lightweightIntervalSeconds, probeOnAddressChange]
      properties:
        id:
          type: string
          format: uuid
        nodeId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          $ref: "#/components/schemas/NetworkEgressKind"
        family:
          $ref: "#/components/schemas/AddressFamily"
        interfaceName:
          type: string
          minLength: 1
          maxLength: 64
        sourceAddress:
          type: string
          minLength: 2
          maxLength: 45
        proxyId:
          type: string
          format: uuid
        enabled:
          type: boolean
        available:
          type: boolean
        automatic:
          type: boolean
        lightweightIntervalSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036
        probeOnAddressChange:
          type: boolean
        deletionStatus:
          $ref: "#/components/schemas/EgressDeletionStatus"
        deletionError:
          type: string
          minLength: 1
          maxLength: 1024
    EgressDeletionStatus:
      type: string
      enum: [pending, failed]
    EgressDeletion:
      type: object
      additionalProperties: false
      required: [egressId, nodeId, status, requestedAt]
      properties:
        egressId:
          type: string
          format: uuid
        nodeId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EgressDeletionStatus"
        requestedAt:
          type: string
          format: date-time
        error:
          type: string
          minLength: 1
          maxLength: 1024
    NetworkEgressCandidate:
      type: object
      additionalProperties: false
      required: [kind, family, interfaceName, temporary, eligible]
      properties:
        kind:
          type: string
          enum: [interface, source]
        family:
          $ref: "#/components/schemas/AddressFamily"
        interfaceName:
          type: string
          minLength: 1
          maxLength: 64
        sourceAddress:
          type: string
          minLength: 2
          maxLength: 45
        scope:
          $ref: "#/components/schemas/NetworkAddressScope"
        temporary:
          type: boolean
        eligible:
          type: boolean
        unavailableReason:
          type: string
          enum: [interface-down, no-usable-route, temporary-address, unusable-address]
        configuredEgressId:
          type: string
          format: uuid
    NodeNetworkState:
      type: object
      additionalProperties: false
      required: [egresses, candidates, addressStates, addressEvents, addressGaps]
      properties:
        inventory:
          $ref: "#/components/schemas/NetworkInventory"
        inventoryError:
          type: string
          minLength: 1
          maxLength: 1024
        inventoryReceivedAt:
          type: string
          format: date-time
        egresses:
          type: array
          items:
            $ref: "#/components/schemas/NetworkEgress"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/NetworkEgressCandidate"
        addressStates:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/AgentAddressState"
        addressEvents:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentAddressEvent"
        addressGaps:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentAddressGap"
    NetworkEgressCreate:
      type: object
      additionalProperties: false
      required: [kind, family]
      properties:
        kind:
          type: string
          enum: [interface, source, proxy]
        family:
          $ref: "#/components/schemas/AddressFamily"
        interfaceName:
          type: string
          minLength: 1
          maxLength: 64
        sourceAddress:
          type: string
          minLength: 2
          maxLength: 45
        proxyId:
          type: string
          format: uuid
    NetworkEgressUpdate:
      type: object
      additionalProperties: false
      required: [enabled, lightweightIntervalSeconds, probeOnAddressChange]
      properties:
        enabled:
          type: boolean
        lightweightIntervalSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036
        probeOnAddressChange:
          type: boolean
    AgentEgressConfiguration:
      type: object
      additionalProperties: false
      required: [id, kind, family, enabled, lightweightIntervalSeconds, probeOnAddressChange]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NetworkEgressKind"
        family:
          $ref: "#/components/schemas/AddressFamily"
        interfaceName:
          type: string
          minLength: 1
          maxLength: 64
        sourceAddress:
          type: string
          minLength: 2
          maxLength: 45
        proxyId:
          type: string
          format: uuid
        enabled:
          type: boolean
        lightweightIntervalSeconds:
          type: integer
          format: int64
          minimum: 1
        probeOnAddressChange:
          type: boolean
    NetworkProxyScheme:
      type: string
      enum: [http, https, socks5]
    NetworkProxy:
      type: object
      additionalProperties: false
      required: [id, name, scheme, host, port, passwordConfigured, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        scheme:
          $ref: "#/components/schemas/NetworkProxyScheme"
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 512
        passwordConfigured:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NetworkProxyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/NetworkProxy"
    NetworkProxyCreate:
      type: object
      additionalProperties: false
      required: [name, scheme, host, port]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        scheme:
          $ref: "#/components/schemas/NetworkProxyScheme"
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 512
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
    NetworkProxyPasswordAction:
      type: string
      enum: [keep, replace, clear]
    NetworkProxyUpdate:
      type: object
      additionalProperties: false
      required: [name, scheme, host, port, passwordAction]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        scheme:
          $ref: "#/components/schemas/NetworkProxyScheme"
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 512
        passwordAction:
          $ref: "#/components/schemas/NetworkProxyPasswordAction"
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
    AgentProxyConfiguration:
      type: object
      additionalProperties: false
      required: [id, scheme, host, port]
      properties:
        id:
          type: string
          format: uuid
        scheme:
          $ref: "#/components/schemas/NetworkProxyScheme"
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 512
        password:
          type: string
          minLength: 1
          maxLength: 4096
    NetworkObservationSettings:
      type: object
      additionalProperties: false
      required: [ipv4Services, ipv6Services, updatedAt]
      properties:
        ipv4Services:
          $ref: "#/components/schemas/DiscoveryServiceList"
        ipv6Services:
          $ref: "#/components/schemas/DiscoveryServiceList"
        updatedAt:
          type: string
          format: date-time
    NetworkObservationSettingsUpdate:
      type: object
      additionalProperties: false
      required: [ipv4Services, ipv6Services]
      properties:
        ipv4Services:
          $ref: "#/components/schemas/DiscoveryServiceList"
        ipv6Services:
          $ref: "#/components/schemas/DiscoveryServiceList"
    DiscoveryServiceList:
      type: array
      minItems: 2
      maxItems: 8
      items:
        type: string
        format: uri
        minLength: 8
        maxLength: 2048
    AddressObservationStatus:
      type: string
      enum: [confirmed, failed]
    AddressFailureReason:
      type: string
      enum: [selector-unavailable, no-valid-response, confirmation-unavailable, conflicting-responses]
    AddressEventKind:
      type: string
      enum: [first-observation, address-change, check-failure, recovery]
    AgentAddressState:
      type: object
      additionalProperties: false
      required: [egressId, historyGeneration, family, status, sequence, proxyPath, likelyNat, temporary, lastCheckedAt]
      properties:
        egressId:
          type: string
